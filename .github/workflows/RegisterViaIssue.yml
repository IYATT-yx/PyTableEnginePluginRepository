name: Register, Update or Clean Plugins

concurrency:
  group: plugin-registration
  cancel-in-progress: false

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  push:
    branches:
      - main
      - master
    paths:
      - 'blacklist.json'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  processPlugin:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
        github.actor != 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Process Registration or Clean Index
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.comment.body || github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: .
        run: |
          python .github/scripts/ProcessIssueRegistration.py

      - name: Commit & Push updated index.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          if ! git diff --cached --quiet; then
            git commit -m "auto: update/clean plugin index"
            git push
          fi

      - name: Close Issue on Success
        if: (github.event_name == 'issues' || github.event_name == 'issue_comment') && github.event.issue.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} --reason "completed"
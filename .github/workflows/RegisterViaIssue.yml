name: Register or Update Plugin via Issue

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  processPlugin:
    if: contains(github.event.issue.body, 'github.com') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Process Registration & Update Index
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: .
        run: |
          python .github/scripts/ProcessIssueRegistration.py

      - name: Commit & Push updated index.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          if ! git diff --cached --quiet; then
            git commit -m "auto: update plugin index for Issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Close Issue on Success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} --reason "completed"